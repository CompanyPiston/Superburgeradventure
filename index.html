<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Прыгающий Бургер - Epic Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    body {
      background-color: #70c5ce;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      transition: background-color 1.2s ease;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      height: 100%;
      max-height: 400px;
      background: linear-gradient(to bottom, #60abb5 0%, #a2d6e6 70%, #d5eff7 100%);
      border: 4px solid #1e272e;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      transition: background 1.2s ease, border-color 1.2s ease, box-shadow 1.2s ease;
    }

    /* Измерение 2: Желудок */
    #game-container.stomach-theme {
      background: linear-gradient(to bottom, #091a0c 0%, #17381a 60%, #0d240e 100%);
      border-color: #00ff66;
      box-shadow: 0 0 30px rgba(0, 255, 102, 0.4);
    }

    /* Экраны блокировки и управления кодами */
    .overlay-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.92); display: flex; flex-direction: column;
      justify-content: center; align-items: center; gap: 12px; z-index: 200; color: white;
    }

    .code-input {
      padding: 10px 15px; font-size: 20px; border-radius: 8px; border: 2px solid #2ed573;
      text-align: center; outline: none; background: #222; color: #fff; width: 220px;
    }

    .action-btn {
      padding: 10px 22px; font-size: 16px; font-weight: bold; border: none;
      border-radius: 8px; background: #2ed573; color: white; cursor: pointer;
    }

    #back-admin-btn {
      position: absolute; top: 15px; left: 15px; background: #e74c3c;
    }

    #code-list {
      max-height: 90px; overflow-y: auto; background: #111; padding: 8px;
      border-radius: 6px; width: 220px; text-align: center; font-size: 14px;
    }

    /* Заставка Company Piston */
    #intro-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-color: #000000; display: flex; justify-content: center; align-items: center;
      z-index: 100; opacity: 1; transition: opacity 1.5s ease-in-out;
    }

    #intro-screen h1 {
      color: #ffffff; font-size: 32px; letter-spacing: 4px;
      text-transform: uppercase; font-weight: 300; opacity: 0;
      animation: fadeInOut 3s ease-in-out forwards;
    }

    @keyframes fadeInOut {
      0% { opacity: 0; transform: scale(0.95); }
      40% { opacity: 1; transform: scale(1); }
      70% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.05); }
    }

    #fullscreen-btn {
      position: absolute; top: 10px; right: 10px; z-index: 50;
      background: rgba(0, 0, 0, 0.6); color: white;
      border: 2px solid white; border-radius: 8px;
      padding: 6px 12px; font-size: 14px; font-weight: bold; cursor: pointer;
    }

    #click-zone {
      display: none; position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; z-index: 5; cursor: pointer;
    }

    #main-menu {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85); display: flex; flex-direction: column;
      justify-content: center; align-items: center; gap: 20px; z-index: 20;
    }

    #main-menu h1 { color: #f1c40f; font-size: 36px; text-shadow: 3px 3px 0 #000; text-align: center; }

    .menu-btn {
      padding: 12px 35px; font-size: 20px; font-weight: bold;
      border: none; border-radius: 8px; cursor: pointer;
    }

    #start-btn { background-color: #2ed573; color: white; box-shadow: 0 5px 0 #26af5f; }
    #credits-btn { background-color: #eccc68; color: #333; box-shadow: 0 5px 0 #d4b100; }

    #credits-screen {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-color: #000000; color: #ffffff; flex-direction: column;
      justify-content: center; align-items: center; font-size: 32px; font-weight: bold; z-index: 30;
    }

    #back-btn {
      position: absolute; top: 20px; left: 20px; padding: 10px 20px;
      background-color: #ffffff; color: #000000; border: none;
      border-radius: 6px; font-size: 18px; font-weight: bold; cursor: pointer;
    }

    .cloud {
      position: absolute; background: #fff; border-radius: 50px;
      opacity: 0.9; z-index: 1; animation: moveClouds linear infinite;
    }
    .cloud::before, .cloud::after { content: ''; position: absolute; background: #fff; border-radius: 50%; }
    .cloud1 { width: 120px; height: 40px; top: 40px; animation-duration: 18s; }
    .cloud1::before { width: 50px; height: 50px; top: -20px; left: 20px; }
    .cloud1::after { width: 40px; height: 40px; top: -15px; left: 60px; }

    .cloud2 { width: 160px; height: 50px; top: 100px; animation-duration: 25s; animation-delay: -10s; transform: scale(0.8); opacity: 0.7; }
    .cloud2::before { width: 70px; height: 70px; top: -30px; left: 25px; }
    .cloud2::after { width: 50px; height: 50px; top: -20px; left: 80px; }

    @keyframes moveClouds { from { left: 100%; } to { left: -200px; } }

    /* Земля / Дно желудка */
    #ground {
      position: absolute; bottom: 0; width: 100%; height: 60px;
      background-color: #8c4a27;
      border-top: 6px solid #4eb82c;
      background-image: 
        radial-gradient(circle, #5c2f17 25%, transparent 26%),
        radial-gradient(circle, #3d1e0e 25%, transparent 26%);
      background-size: 18px 18px;
      background-position: 0 0, 9px 9px;
      z-index: 2; transition: all 1.2s ease;
    }

    #ground.stomach-ground {
      background-color: #143818;
      border-top: 6px solid #00ff66;
      background-image: 
        radial-gradient(circle, #081a0b 25%, transparent 26%),
        radial-gradient(circle, #1e4f24 25%, transparent 26%);
    }

    /* ТЕКСТУРА БУРГЕРА (SVG) */
    #burger {
      position: absolute; width: 60px; height: 60px;
      bottom: 60px; left: 80px;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="bunTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="%23f39c12"/><stop offset="100%" stop-color="%23d35400"/></linearGradient><linearGradient id="patty" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="%235c2518"/><stop offset="100%" stop-color="%2338140b"/></linearGradient></defs><ellipse cx="50" cy="28" rx="42" ry="22" fill="url(%23bunTop)"/><ellipse cx="50" cy="24" rx="38" ry="18" fill="%23f8c471" opacity="0.4"/><ellipse cx="30" cy="18" rx="2.5" ry="3.5" fill="%23fff8e7" transform="rotate(-15 30 18)"/><ellipse cx="50" cy="14" rx="2.5" ry="3.5" fill="%23fff8e7"/><ellipse cx="68" cy="19" rx="2.5" ry="3.5" fill="%23fff8e7" transform="rotate(15 68 19)"/><path d="M8 38 Q 25 46, 42 38 T 75 38 T 92 38 L 92 44 L 8 44 Z" fill="%2327ae60"/><rect x="6" y="44" width="88" height="6" rx="2" fill="%23f1c40f"/><rect x="8" y="50" width="84" height="15" rx="5" fill="url(%23patty)"/><rect x="10" y="52" width="80" height="11" rx="4" fill="%2378281f" opacity="0.5"/><ellipse cx="50" cy="68" rx="42" ry="14" fill="%23d35400"/><ellipse cx="50" cy="66" rx="40" ry="12" fill="url(%23bunTop)"/></svg>');
      background-size: contain; background-repeat: no-repeat; background-position: center;
      z-index: 3; filter: drop-shadow(0 6px 5px rgba(0,0,0,0.4));
      transition: transform 0.2s ease, opacity 0.3s;
    }

    /* ТЕКСТУРА РУКИ ВЕЛИКАНА (SVG) */
    #giant-hand {
      position: absolute;
      top: -260px;
      left: 20px;
      width: 180px;
      height: 250px;
      z-index: 10;
      pointer-events: none;
      transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150"><defs><linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="%23e0a96d"/><stop offset="100%" stop-color="%23b87d4b"/></linearGradient></defs><rect x="25" y="0" width="50" height="70" fill="url(%23skin)" rx="10"/><rect x="15" y="50" width="16" height="65" fill="url(%23skin)" rx="8"/><rect x="33" y="55" width="16" height="75" fill="url(%23skin)" rx="8"/><rect x="51" y="55" width="16" height="70" fill="url(%23skin)" rx="8"/><rect x="69" y="50" width="15" height="58" fill="url(%23skin)" rx="7"/><rect x="0" y="30" width="18" height="50" fill="url(%23skin)" rx="8" transform="rotate(-25 10 40)"/></svg>');
      background-size: contain;
      background-repeat: no-repeat;
      filter: drop-shadow(0 15px 15px rgba(0,0,0,0.6));
    }

    /* НАДПИСЬ УРОВЕНЬ 2 */
    #level2-title {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 48px;
      font-weight: 900;
      color: #00ff66;
      text-shadow: 0 0 20px #00ff66, 4px 4px 0px #000;
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
      letter-spacing: 2px;
    }

    #obstacle { position: absolute; bottom: 60px; right: -100px; z-index: 3; }

    /* ТЕКСТУРЫ ПРЕПЯТСТВИЙ (SVG) */
    .type-spike {
      width: 40px; height: 50px;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 50"><defs><linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="%23555"/><stop offset="50%" stop-color="%23aaa"/><stop offset="100%" stop-color="%23333"/></linearGradient></defs><polygon points="20,0 0,50 40,50" fill="url(%23metal)"/><line x1="20" y1="0" x2="20" y2="50" stroke="%23222" stroke-width="2"/></svg>');
      background-size: contain; background-repeat: no-repeat;
    }

    .type-wall {
      width: 45px; height: 85px;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 85"><rect x="0" y="0" width="45" height="85" fill="%23b03a2e" rx="4"/><rect x="3" y="3" width="39" height="37" fill="%23cd6155" rx="2"/><rect x="3" y="44" width="39" height="38" fill="%23cd6155" rx="2"/><line x1="0" y1="42" x2="45" y2="42" stroke="%23512e5f" stroke-width="4"/><line x1="22" y1="3" x2="22" y2="40" stroke="%23512e5f" stroke-width="2"/><line x1="18" y1="44" x2="18" y2="82" stroke="%23512e5f" stroke-width="2"/><rect x="0" y="0" width="45" height="85" fill="none" stroke="%231f618d" stroke-width="3" rx="4"/></svg>');
      background-size: contain; background-repeat: no-repeat;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,0.5));
    }

    .type-stairs {
      width: 65px; height: 60px;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 65 60"><path d="M0 60 L0 40 L22 40 L22 20 L44 20 L44 0 L65 0 L65 60 Z" fill="%23626567"/><path d="M0 40 L22 40 L22 20 L44 20 L44 0 L65 0 L65 10 L44 10 L44 30 L22 30 L22 50 L0 50 Z" fill="%239896a4"/><path d="M0 60 L0 40 L22 40 L22 20 L44 20 L44 0 L65 0 L65 60 Z" fill="none" stroke="%231c2833" stroke-width="3"/></svg>');
      background-size: contain; background-repeat: no-repeat;
    }

    .type-acid-spike {
      width: 45px; height: 55px;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 55"><polygon points="22,0 0,55 45,55" fill="%2300ff66"/><polygon points="22,0 22,55 45,55" fill="%2300aa44"/><polygon points="22,0 12,55 22,55" fill="%23ccffdd"/></svg>');
      background-size: contain; background-repeat: no-repeat;
      filter: drop-shadow(0 0 12px #00ff66);
    }

    #ui {
      position: absolute; top: 15px; left: 20px; display: flex; gap: 20px;
      font-size: 20px; font-weight: bold; color: white; text-shadow: 2px 2px 4px #000; z-index: 4;
    }

    #game-over-screen {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75); flex-direction: column; justify-content: center;
      align-items: center; color: white; z-index: 15;
    }

    #game-over-screen h1 { font-size: 40px; color: #ff4757; text-shadow: 3px 3px 0px #000; margin-bottom: 20px; }
    #restart-btn {
      padding: 14px 32px; font-size: 20px; font-weight: bold;
      background-color: #2ed573; color: white; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 5px 0px #26af5f;
    }
  </style>
</head>
  <body>

  <div id="game-container">
    
    <!-- Экран входа по коду -->
    <div id="auth-screen" class="overlay-screen">
      <h2>ВВЕДИТЕ КОД ДОСТУПА</h2>
      <input type="text" id="access-code-input" class="code-input" placeholder="Введите код..." maxlength="10">
      <button class="action-btn" onclick="checkAccessCode()">Войти</button>
      <p id="auth-error" style="color: #ff4757; display: none;">Неверный код!</p>
    </div>

    <!-- Меню создания кодов (Админ) -->
    <div id="admin-screen" class="overlay-screen" style="display: none;">
      <button id="back-admin-btn" class="action-btn" onclick="exitAdminMenu()">← Назад</button>
      <h2>МЕНЮ СОЗДАНИЯ КОДОВ</h2>
      <input type="text" id="new-code-input" class="code-input" placeholder="Новый код..." maxlength="10">
      <button class="action-btn" onclick="createNewCode()">Создать код</button>
      
      <p style="font-size: 14px; margin-top: 5px;">Созданные коды:</p>
      <div id="code-list"></div>
    </div>

    <!-- Заставка разработчика -->
    <div id="intro-screen">
      <h1>Company Piston</h1>
    </div>

    <button id="fullscreen-btn" onclick="toggleFullscreen()">⛶ На весь экран</button>

    <div id="click-zone"></div>

    <!-- Главное меню -->
    <div id="main-menu" style="display: none;">
      <h1>ПРИКЛЮЧЕНИЯ БУРГЕРА</h1>
      <button class="menu-btn" id="start-btn" onclick="startGame()">Начать</button>
      <button class="menu-btn" id="credits-btn" onclick="openCredits()">Credits</button>
    </div>

    <!-- Экран авторов -->
    <div id="credits-screen">
      <button id="back-btn" onclick="closeCredits()">Назад</button>
      <p>5 бургеров</p>
    </div>

    <!-- Декоративные облака -->
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>

    <!-- UI Игры -->
    <div id="ui">
      <div id="lives-display">Жизни: ❤️❤️❤️</div>
      <div id="score-display">Очки: 00000</div>
    </div>
    
    <!-- Игровые элементы -->
    <div id="level2-title">УРОВЕНЬ 2</div>
    <div id="burger"></div>
    <div id="giant-hand"></div>
    <div id="obstacle" class="type-spike"></div>
    <div id="ground"></div>

    <!-- Конец игры -->
    <div id="game-over-screen">
      <h1>ИГРА ОКОНЧАНА</h1>
      <button id="restart-btn" onclick="resetGame()">Начать заново</button>
    </div>
  </div>
      <script>
    // Система авторизации и кодов
    let globalCodes = ["1111"];

    const authScreen = document.getElementById('auth-screen');
    const adminScreen = document.getElementById('admin-screen');
    const accessInput = document.getElementById('access-code-input');
    const newCodeInput = document.getElementById('new-code-input');
    const authError = document.getElementById('auth-error');
    const codeListDiv = document.getElementById('code-list');

    // Элементы игры
    const burger = document.getElementById('burger');
    const giantHand = document.getElementById('giant-hand');
    const obstacle = document.getElementById('obstacle');
    const livesDisplay = document.getElementById('lives-display');
    const scoreDisplay = document.getElementById('score-display');
    const gameOverScreen = document.getElementById('game-over-screen');
    const clickZone = document.getElementById('click-zone');
    const mainMenu = document.getElementById('main-menu');
    const creditsScreen = document.getElementById('credits-screen');
    const introScreen = document.getElementById('intro-screen');
    const container = document.getElementById('game-container');
    const ground = document.getElementById('ground');
    const level2Title = document.getElementById('level2-title');

    // Игровые переменные
    let isJumping = false;
    let burgerY = 0;
    let gravity = 0.9;
    let velocity = 0;

    let obstacleX = 850;
    let baseSpeed = 6;
    let spikeSpeed = 6;
    let currentObstacleType = 'spike';
    let obstacleWidth = 40;
    let obstacleHeight = 50;

    let lives = 3;
    let score = 0;
    let isGameOver = false;
    let isInvulnerable = false;
    let isGameStarted = false;
    let isAcidMode = false;
    let isCutscene = false;

    // Звуки через Web Audio API
    let audioCtx = null;

    function playEatingSounds() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      let soundCount = 10;
      let interval = setInterval(() => {
        if (soundCount <= 0) {
          clearInterval(interval);
          return;
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = soundCount % 2 === 0 ? 'sawtooth' : 'square';
        osc.frequency.setValueAtTime(100 + Math.random() * 200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.15);
        
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);

        soundCount--;
      }, 450);
    }

    // Сохранение и загрузка кодов
    function loadSavedCodes() {
      const saved = localStorage.getItem('burger_game_codes');
      if (saved) globalCodes = JSON.parse(saved);
      renderCodeList();
    }

    function saveCodes() {
      localStorage.setItem('burger_game_codes', JSON.stringify(globalCodes));
    }

    function checkAccessCode() {
      const code = accessInput.value.trim();
      if (code === "6490") {
        authScreen.style.display = 'none';
        adminScreen.style.display = 'flex';
        renderCodeList();
      } else if (globalCodes.includes(code)) {
        authScreen.style.display = 'none';
        mainMenu.style.display = 'flex';
        triggerIntroAnimation();
      } else {
        authError.style.display = 'block';
      }
    }

    function createNewCode() {
      const newCode = newCodeInput.value.trim();
      if (newCode && !globalCodes.includes(newCode)) {
        globalCodes.push(newCode);
        newCodeInput.value = '';
        saveCodes();
        renderCodeList();
      }
    }

    function exitAdminMenu() {
      adminScreen.style.display = 'none';
      authScreen.style.display = 'flex';
      accessInput.value = '';
      authError.style.display = 'none';
    }

    function renderCodeList() {
      codeListDiv.innerHTML = globalCodes.map(c => `<div>• ${c}</div>`).join('');
    }

    function triggerIntroAnimation() {
      setTimeout(() => {
        introScreen.style.opacity = '0';
        setTimeout(() => { introScreen.style.display = 'none'; }, 1500);
      }, 500);
    }

    async function toggleFullscreen() {
      try {
        const doc = window.document;
        const docEl = container;
        const requestFullscreen = docEl.requestFullscreen || docEl.webkitRequestFullscreen;
        const exitFullscreen = doc.exitFullscreen || doc.webkitExitFullscreen;
        const isFullscreen = doc.fullscreenElement || doc.webkitFullscreenElement;

        if (!isFullscreen) {
          if (requestFullscreen) await requestFullscreen.call(docEl);
        } else {
          if (exitFullscreen) await exitFullscreen.call(doc);
        }
      } catch (err) {}
    }

    function openCredits() { creditsScreen.style.display = 'flex'; }
    function closeCredits() { creditsScreen.style.display = 'none'; }

    const NORMAL_OBSTACLES = [
      { name: 'spike', className: 'type-spike', width: 40, height: 45 },
      { name: 'wall', className: 'type-wall', width: 45, height: 85 },
      { name: 'stairs', className: 'type-stairs', width: 65, height: 60 }
    ];

    function jump() {
      if (!isJumping && !isGameOver && isGameStarted && !isCutscene) {
        isJumping = true;
        velocity = 16;
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        jump();
      }
    });

    clickZone.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); });
    clickZone.addEventListener('mousedown', (e) => { e.preventDefault(); jump(); });

    function startGame() {
      mainMenu.style.display = 'none';
      clickZone.style.display = 'block';
      isGameStarted = true;
      resetGame();
    }

    function resetGame() {
      lives = 3;
      score = 0;
      spikeSpeed = baseSpeed;
      isGameOver = false;
      isInvulnerable = false;
      isAcidMode = false;
      isCutscene = false;
      burgerY = 0;
      velocity = 0;
      isJumping = false;

      container.classList.remove('stomach-theme');
      ground.classList.remove('stomach-ground');
      giantHand.style.transform = 'translateY(0px)';
      burger.style.opacity = '1';
      level2Title.style.opacity = '0';

      updateLivesDisplay();
      scoreDisplay.innerText = `Очки: 000000`;
      gameOverScreen.style.display = 'none';
      
      resetObstacle();
      requestAnimationFrame(gameLoop);
    }

    function updateLivesDisplay() {
      livesDisplay.innerText = 'Жизни: ' + '❤️'.repeat(Math.max(0, lives));
    }

    function resetObstacle() {
      obstacleX = container.clientWidth + 50;
      
      if (!isAcidMode) {
        const randomObj = NORMAL_OBSTACLES[Math.floor(Math.random() * NORMAL_OBSTACLES.length)];
        currentObstacleType = randomObj.name;
        obstacle.className = randomObj.className;
        obstacleWidth = randomObj.width;
        obstacleHeight = randomObj.height;
      } else {
        currentObstacleType = 'acid-spike';
        obstacle.className = 'type-acid-spike';
        obstacleWidth = 45;
        obstacleHeight = 55;
      }
      
      obstacle.style.right = '-100px';
    }

    function triggerLevel2Cutscene() {
      isCutscene = true;
      obstacleX = container.clientWidth + 200;
      obstacle.style.left = obstacleX + 'px';

      // 1. Рука спускается и хватает бургер
      giantHand.style.transform = 'translateY(210px)';

      setTimeout(() => {
        playEatingSounds();
        
        // 2. Рука поднимет бургер вверх
        giantHand.style.transform = 'translateY(-100px)';
        burger.style.transform = 'translateY(-300px)';
        burger.style.opacity = '0';

        setTimeout(() => {
          // 3. Переход в желудок (Уровень 2)
          isAcidMode = true;
          container.classList.add('stomach-theme');
          ground.classList.add('stomach-ground');

          // Надпись Уровень 2
          level2Title.style.opacity = '1';
          setTimeout(() => { level2Title.style.opacity = '0'; }, 2000);

          // Спавн бургера обратно
          burgerY = 0;
          burger.style.transform = 'translateY(0px)';
          burger.style.opacity = '1';
          
          isCutscene = false;
          resetObstacle();
        }, 3000);

      }, 1200);
    }

    function takeDamage() {
      lives--;
      updateLivesDisplay();
      
      isInvulnerable = true;
      burger.style.opacity = '0.4';

      if (lives <= 0) {
        isGameOver = true;
        gameOverScreen.style.display = 'flex';
      } else {
        setTimeout(() => {
          isInvulnerable = false;
          burger.style.opacity = '1';
        }, 1200);
      }
    }

    function gameLoop() {
      if (isGameOver) return;

      if (!isCutscene) {
        // Старая система: Очки быстро прибавляются автоматически каждый кадр!
        score += 80;
        scoreDisplay.innerText = `Очки: ${String(score).padStart(6, '0')}`;

        // Кат-сцена запускается ровно на 100 000 (100k) очков
        if (score >= 100000 && !isAcidMode) {
          triggerLevel2Cutscene();
          requestAnimationFrame(gameLoop);
          return;
        }

        // Физика прыжка
        if (isJumping) {
          burgerY += velocity;
          velocity -= gravity;
          if (burgerY <= 0) {
            burgerY = 0;
            isJumping = false;
          }
        }
        burger.style.bottom = (60 + burgerY) + 'px';

        // Движение препятствия
        obstacleX -= spikeSpeed;
        obstacle.style.left = obstacleX + 'px';

        if (obstacleX < -obstacleWidth) {
          spikeSpeed += 0.15;
          resetObstacle();
        }

        // Проверка столкновений
        const burgerLeft = 80;
        const burgerRight = 80 + 50;
        const obstacleLeft = obstacleX;
        const obstacleRight = obstacleX + obstacleWidth;

        if (
          burgerRight > obstacleLeft && 
          burgerLeft < obstacleRight && 
          burgerY < (obstacleHeight - 10)
        ) {
          if (!isInvulnerable) {
            takeDamage();
          }
        }
      }

      requestAnimationFrame(gameLoop);
    }

    // Старт загрузки
    loadSavedCodes();
  </script>
</body>
</html>
